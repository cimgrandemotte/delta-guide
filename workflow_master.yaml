---
# ═══════════════════════════════════════════════════════════════════════════
#  WORKFLOW MASTER — DELTA FORCE : THE ULTIMATE OPERATOR'S GUIDE
#  Référence unique de pilotage de l'agent. Toute décision de build
#  doit être traçable ici. Mise à jour à chaque transition d'état.
# ═══════════════════════════════════════════════════════════════════════════

projet:
  nom: "Delta Force — The Ultimate Operator's Guide"
  slogan: "Every Raid. Every Operator. Every Edge."
  racine: "/home/user/delta-force-ultimate-guide"
  langue_principale: "fr-FR"
  langue_technique: "en (termes gaming conservés)"
  ton: "Militaire, tactique, immersif, cinématographique, expert gaming"
  auteur: "Arena.ai Agent — Autonomous Build"
  statut_legal: "Fan-site non officiel — Delta Force © Team Jade / TiMi Studio Group / Level Infinite / Garena"
  saison_cible: "S12 Aurora (déploiement annoncé 10/11/2026)"
  date_build: "2026-11-19"
  url_jeu_officiel: "https://www.playdeltaforce.com/fr/"

# ───────────────────────────────────────────────────────────────────────────
# 1. RÈGLES ABSOLUES (contrat non négociable avec l'utilisateur)
# ───────────────────────────────────────────────────────────────────────────
regles_absolues:
  - id: R01
    regle: "JAMAIS d'archive ZIP ni de fichier compressé."
  - id: R02
    regle: "JAMAIS de fichier PDF."
  - id: R03
    regle: "Images générées : JPG exclusivement (.jpg). Jamais PNG/WebP/AVIF."
  - id: R04
    regle: "Maximum 10 images JPG générées par réponse de l'agent."
  - id: R05
    regle: "Audios générés : MP3 exclusivement (.mp3)."
  - id: R06
    regle: "Maximum 10 audios MP3 générés par réponse de l'agent."
  - id: R07
    regle: "Arrêt + demande explicite de 'CONTINUER' à chaque transition d'état S0→S9."
  - id: R08
    regle: "Autonomie totale À L'INTÉRIEUR d'un état : aucune question bloquante hors transitions."
  - id: R09
    regle: "JAMAIS inventer une donnée de gameplay. Toute stat/date/nom provient d'une source web vérifiée et horodatée."
  - id: R10
    regle: "Toute donnée non confirmée est marquée 'À CONFIRMER' dans le JSON et affichée avec un badge d'incertitude sur le site."
  - id: R11
    regle: "Crédits + disclaimer légal Team Jade / TiMi / Level Infinite / Garena sur chaque page (footer)."
  - id: R12
    regle: "Images hyperréalistes / photoréalistes / cinématographiques (rendu UE5, éclairage volumétrique)."

# ───────────────────────────────────────────────────────────────────────────
# 2. CONTRAINTES PLATEFORME IDENTIFIÉES EN S0 (limites réelles de l'outillage)
#    → Déclarées à l'utilisateur à la fin de S0 pour arbitrage.
# ───────────────────────────────────────────────────────────────────────────
contraintes_plateforme:
  audio:
    capacite_reelle: "Synthèse vocale (text-to-speech) multi-voix, export .mp3. Voix sélectionnée par l'utilisateur via audition."
    non_disponible: "Musique, nappes d'ambiance, bruitages réalistes (artillerie, rechargement, moteur) : non générables par TTS."
    strategie_retenue:
      - "A. Briefings / guides opérateurs / intro de section → TTS MP3 (voix militaire FR). 100% faisable."
      - "B. Sons d'UI (hover, clic, copy, alerte, countdown) → synthèse procédurale Web Audio API (oscillateurs + enveloppes) dans assets/js/sfx.js. Zéro fichier, zéro latence, 100% hors-ligne."
      - "C. Ambiances de carte → générées localement par synthèse DSP (bruit filtré + modulations) encodées en MP3 si un encodeur est disponible, sinon remplacées par des nappes Web Audio."
    validation_s0: "FAIT — ffmpeg/lame/sox absents du sandbox MAIS encodeur `lameenc` (libmp3lame) installé avec succès en Python. => L'encodage MP3 local de nappes DSP synthétisées est CONFIRMÉ possible (vent, rumble de barrage, drone électronique, radio statique). Les bruitages réalistes échantillonnés (vraie artillerie, vrai rechargement d'arme) restent hors de portée."
  images:
    capacite_reelle: "Génération texte→image, 1 image par appel, sortie .jpg."
    budget: "10 JPG max par réponse → le plan d'assets est séquencé par lots de 10 (voir section 7)."
  donnees_live:
    contrainte: "Le site est statique (pas de backend). Les 'données live' (codes de portes, prix marché) ne peuvent pas être scrapées côté navigateur (CORS)."
    strategie_retenue: "Fichiers data/daily_codes.json et data/market_prices.json alimentés au build + horodatage visible + lien vers la source officielle + instructions de mise à jour manuelle documentées dans le README."

# ───────────────────────────────────────────────────────────────────────────
# 3. NORMALISATION DE L'ARBORESCENCE (décisions prises en S0)
#    Le prompt source contenait des doublons de chemins. Canon retenu :
# ───────────────────────────────────────────────────────────────────────────
normalisation_chemins:
  - decision: "pages/hazard-operations/ ET pages/hazard-ops/ → canon : pages/hazard-ops/"
  - decision: "pages/cartes-interactives/ ET pages/cartes/ → canon : pages/cartes/"
  - decision: "pages/campagne/ ET pages/black-hawk-down/ → canon : pages/black-hawk-down/"
  - decision: "pages/astuces/ ET pages/astuces-pro/ → canon : pages/astuces-pro/"
  - decision: "Aucun caractère accentué ni espace dans les noms de fichiers (stratégies.html → strategies.html, avancé.html → avance.html, d-wolf.html retenu contre dwolf.html)."
  - decision: "Scripts outils : noms canoniques = ttk_calculator.js, ammo_penetration.js, build_copier.js, maps_leaflet.js, blacksite_planner.js, loot_calculator.js, daily_codes.js, market_prices.js, tier_list.js, quiz.js, search.js, sfx.js, utils.js."
  - decision: "Toutes les URL internes sont relatives (déploiement sous-dossier GitHub Pages compatible)."

# ───────────────────────────────────────────────────────────────────────────
# 4. MACHINE À ÉTATS — vue synthétique (détail machine : fsm_states.json)
# ───────────────────────────────────────────────────────────────────────────
machine_a_etats:
  modele: "FSM linéaire à checkpoints utilisateur. Une transition = un 'CONTINUER'."
  etats:
    - id: S0
      nom: INIT
      objectif: "Workflow, FSM, arborescence, fichiers de configuration."
      livrables: [workflow_master.yaml, fsm_states.json, package.json, vercel.json, netlify.toml, .github/workflows/deploy.yml, robots.txt, manifest.json, sitemap.xml, .gitignore, LICENSE]
      sortie: "Structure créée + contraintes plateforme déclarées → CONTINUER"
    - id: S1
      nom: RESEARCH
      objectif: "Recherche web exhaustive et horodatée sur toutes les sources listées."
      livrables: [research/research_data.json, research/sources_log.json, data/season12.json, data/operators.json, data/weapons.json, data/ammo.json, data/keycards.json, data/bosses.json, data/vehicles.json, data/blacksite.json, data/builds.json, data/tier_list.json]
      regle_qualite: "Chaque fait porte: valeur, source_url, date_source, niveau_confiance (confirme|probable|a_confirmer)."
      sortie: "Top 10 des trouvailles S12 + liste des points non vérifiables → CONTINUER"
    - id: S2
      nom: DESIGN_SYSTEM
      objectif: "Charte graphique, CSS, JS socle, 10 premières images JPG, voix TTS + premiers MP3."
      livrables: [assets/css/design_system.css, assets/css/animations.css, assets/css/components.css, assets/css/responsive.css, assets/js/main.js, assets/js/components.js, assets/js/animations.js, assets/js/sfx.js, assets/js/utils.js, "10 JPG lot 1", "voix TTS enregistrées"]
      sortie: "Aperçu design + assets lot 1 → CONTINUER"
    - id: S3
      nom: BUILD_CORE
      objectif: "index.html (QG), navbar globale, footer, composants réutilisables, recherche globale."
      livrables: [index.html, assets/js/search.js, "composants injectés (navbar/footer/audio player/back-to-top/cookie)"]
      sortie: "Preview live du QG → CONTINUER"
    - id: S4
      nom: BUILD_CONTENT_BATCH1
      objectif: "Opérateurs (hub + fiches), Armurerie & Balistique, Hazard Operations."
      cadence: "Groupes de 2-3 pages, ≤10 JPG et ≤10 MP3 par réponse."
      sortie: "CONTINUER après chaque groupe"
    - id: S5
      nom: BUILD_CONTENT_BATCH2
      objectif: "Cartes interactives, Havoc Warfare & véhicules, Black Hawk Down, Encyclopédie & économie."
      sortie: "CONTINUER après chaque groupe"
    - id: S6
      nom: BUILD_CONTENT_BATCH3
      objectif: "Astuces pro, codes quotidiens, tier list, hub Saison Aurora, news."
      sortie: "CONTINUER"
    - id: S7
      nom: INTERACTIVE_TOOLS
      objectif: "13 outils interactifs opérationnels sur données réelles."
      sortie: "CONTINUER"
    - id: S8
      nom: QA_AND_POLISH
      objectif: "Responsive, perf, SEO, accessibilité WCAG 2.1 AA, liens, polish."
      sortie: "Rapport QA → CONTINUER"
    - id: S9
      nom: FINAL_DELIVERY
      objectif: "README, LICENSE, arborescence finale, instructions de déploiement, rappel /download-workspace."
      sortie: "FIN — état terminal"

