# ───────────────────────────────────────────────────────────────────────────
# 8. CHECKPOINTS DE VALIDATION (critères de sortie d'état)
# ───────────────────────────────────────────────────────────────────────────
checkpoints:
  S0:
    - "Arborescence complète créée (37 dossiers)."
    - "workflow_master.yaml + fsm_states.json valides (parse OK)."
    - "Fichiers de configuration déploiement présents (vercel, netlify, GH Actions)."
    - "Contraintes plateforme déclarées à l'utilisateur."
  S1:
    - "≥ 25 sources interrogées, chacune horodatée dans research/sources_log.json."
    - "Chaque fait S12 porte un niveau de confiance."
    - "Les contradictions entre sources sont listées explicitement."
  S2:
    - "4 CSS + 5 JS socle créés, aucune dépendance externe bloquante pour le rendu de base."
    - "10 JPG lot 1 générés et placés dans les bons sous-dossiers."
    - "Voix TTS validée par l'utilisateur (audition)."
  S3:
    - "index.html se charge sans erreur console, navbar/footer injectés sur toutes les pages."
    - "Serveur de preview lancé et accessible."
  S4-S6:
    - "Chaque page : titre unique, meta description, OG tags, breadcrumb, alt sur toutes les images."
    - "Aucun lien interne cassé (vérif script link_check)."
  S7:
    - "Chaque outil testé avec un jeu de données réel et un cas limite."
  S8:
    - "Responsive vérifié à 320/768/1024/1440 px."
    - "Contraste ≥ 4.5:1, navigation clavier complète, prefers-reduced-motion respecté."
    - "sitemap.xml exhaustif, JSON-LD VideoGame valide."
  S9:
    - "README complet, LICENSE MIT, récapitulatif chiffré, rappel /download-workspace."

# ───────────────────────────────────────────────────────────────────────────
# 9. JOURNAL DES TRANSITIONS
# ───────────────────────────────────────────────────────────────────────────
journal:
  - { date: "2026-11-19", etat: S0, action: "Arborescence + workflow + FSM + configs créés.", statut: "TERMINÉ — en attente de CONTINUER" }
